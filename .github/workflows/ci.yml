name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  source-audit:
    name: Public source boundaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/audit-release.py

  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Vet
        run: go vet ./...
      # Generic upstream provider fixtures use non-Axon localhost endpoints.
      # This job checks the published restriction instead of relaxing it for fixtures.
      - name: Axon distribution regression tests
        run: |
          go test ./internal/distribution -count=1
          go test ./internal/app ./internal/handler -run '^TestDistribution' -count=1
      - name: Build
        run: go build ./...

  web:
    name: Web (Bun + Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Install
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Axon catalog and nullable capability regression tests
        run: bun test test/distribution-policy.test.ts test/model-picker-null-catalog.test.ts test/future-video-model-import.test.tsx test/video-resolution-default-display.test.tsx test/video-resolution-validation.test.tsx
      - name: Build
        run: bun run build

  canvas-agent:
    name: Canvas Agent
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: canvas-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Install
        run: bun install --frozen-lockfile
      - name: MCP binding and production self-check regression tests
        run: bun test test/distribution-policy.test.ts test/film-self-check.test.ts test/film-storyboard-binding.test.ts test/film-production-stages-schema.test.ts test/image-toolbar-tools-schema.test.ts
      - name: Build
        run: bun run build
